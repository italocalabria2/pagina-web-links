<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Italo Calabria</title>
  <meta name="description" content="Página pessoal de Italo Calabria: GitHub, LinkedIn e currículo.">
  <style>
    :root {
      --bg: #0d1117;
      --bg-glow: #1b2a4a;
      --card: #161b22;
      --card-hover: #1c2330;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --bg-glow: #dbe8ff;
        --card: #ffffff;
        --card-hover: #f0f5ff;
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, var(--bg-glow), transparent 70%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #58a6ff, #8957e5);
      box-shadow: 0 8px 30px rgba(88, 166, 255, 0.25);
    }
    h1 { font-size: 2rem; letter-spacing: -0.5px; }
    .subtitle { color: var(--muted); margin: 8px 0 32px; }
    .links { display: grid; gap: 14px; }
    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      text-align: left;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--card-hover);
      outline: none;
    }
    .link svg { width: 28px; height: 28px; flex-shrink: 0; fill: var(--accent); }
    .link .info { flex: 1; min-width: 0; }
    .link .name { font-weight: 600; font-size: 1.05rem; }
    .link .desc { color: var(--muted); font-size: .88rem; }
    .link .arrow { color: var(--muted); font-size: 1.2rem; transition: transform .15s ease; }
    .link:hover .arrow { transform: translateX(4px); color: var(--accent); }
    footer { margin-top: 36px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">IC</div>
    <h1>Italo Calabria</h1>
    <p class="subtitle">Confira meus projetos, minha trajetória e entre em contato.</p>

    <nav class="links" aria-label="Links principais">
      <a class="link" href="https://github.com/italocalabria2?tab=repositories" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        <span class="info">
          <span class="name">GitHub</span><br>
          <span class="desc">Meus repositórios e projetos</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="link" href="https://www.linkedin.com/in/italo-calabria/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
        <span class="info">
          <span class="name">LinkedIn</span><br>
          <span class="desc">Perfil profissional e networking</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="link" href="https://docs.google.com/document/d/1A7ONGg28h_cujvCF4D9Twt6UEkeurOiZIBw6mgfqzLM/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v1.5H8V13zm0 3h8v1.5H8V16zm0-6h3v1.5H8V10z"/></svg>
        <span class="info">
          <span class="name">Currículo</span><br>
          <span class="desc">Veja minha experiência e formação</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <footer>&copy; <span id="ano">2026</span> Italo Calabria</footer>
  </main>
  <script>
    document.getElementById('ano').textContent = new Date().getFullYear();
  </script>
</body>
</html>
